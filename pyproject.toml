[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hashbinkit"
version = "0.2.9"
description = "Hashing utility for binary function similarity analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["r2bagpipe", "numpy", "numba", "tqdm", "scipy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENCE*"]

[project.urls]
Homepage = "https://github.com/valbucci/hashbinkit"
Issues = "https://github.com/valbucci/hashbinkit/issues"

[tool.setuptools.packages.find]
include = ["hashbinkit*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
log_cli = false
log_cli_level = "INFO"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Ruff (PEP-8 enforcement and autoformatting)
[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["E", "F", "I", "W", "D"]
extend-ignore = ["D203", "D213"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
